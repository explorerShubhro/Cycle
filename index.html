<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#DC143C">
<meta name="description" content="A private calendar for tracking menstruation, follicular, ovulation and luteal phases alongside daily mood.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycle">
<meta name="mobile-web-app-capable" content="yes">

<title>Cycle — a quiet calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F4;
    --surface:#FFFFFF;
    --ink:#2E2933;
    --ink-soft:#8A8090;
    --line:#EDE4E7;

    /* Four cycle phases */
    --menstruation:#DC143C;
    --menstruation-tint:#F8DCE2;
    --follicular:#EC7E94;
    --follicular-tint:#FBEAEE;
    --ovulation:#0A6EA8;
    --ovulation-tint:#DCEBF4;
    --luteal:#87CEEB;
    --luteal-tint:#EAF6FC;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }

  .app{ width:100%; max-width:420px; }

  header.top{ text-align:center; margin-bottom:22px; }
  header.top .mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:28px;
  }
  header.top .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  #installBar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  #installBar.show{ display:flex; }
  #installBar .txt{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; }
  #installBar button{
    flex-shrink:0;
    background:var(--menstruation);
    color:#fff;
    border:none;
    padding:9px 14px;
    border-radius:10px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }

  .card{
    background:var(--surface);
    border-radius:20px;
    padding:20px 18px 22px;
    box-shadow:0 1px 2px rgba(46,41,51,0.04);
    border:1px solid var(--line);
  }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .month-nav button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:transparent; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); transition:background 0.15s ease;
  }
  .month-nav button:hover{ background:var(--bg); }
  .month-nav button:focus-visible{ outline:2px solid var(--ovulation); outline-offset:2px; }
  .month-title{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; }

  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .weekdays span{ text-align:center; font-size:11px; color:var(--ink-soft); letter-spacing:0.4px; }

  .grid{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px; }

  .day{ position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .day.empty{ cursor:default; }

  .day .num-wrap{
    position:relative; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .day .num{ font-family:'Fraunces', serif; font-size:14px; font-weight:500; z-index:2; position:relative; }

  .day.today .num-wrap{ box-shadow:inset 0 0 0 1.4px var(--ink); }
  .day.selected .num-wrap{ box-shadow:0 0 0 2px var(--ink); }

  /* Predicted / estimated phase — soft tint, dark text */
  .day.phase-menstruation .num-wrap{ background:var(--menstruation-tint); }
  .day.phase-follicular .num-wrap{ background:var(--follicular-tint); }
  .day.phase-ovulation .num-wrap{ background:var(--ovulation-tint); }
  .day.phase-luteal .num-wrap{ background:var(--luteal-tint); }

  /* Confirmed (explicitly logged) — solid fill, white text */
  .day.confirmed-menstruation .num-wrap{ background:var(--menstruation); }
  .day.confirmed-menstruation .num{ color:#fff; }
  .day.confirmed-ovulation .num-wrap{ background:var(--ovulation); }
  .day.confirmed-ovulation .num{ color:#fff; }

  .mood-dot{ position:absolute; bottom:-2px; font-size:10px; line-height:1; z-index:3; }
  .day:focus-visible .num-wrap{ outline:2px solid var(--ovulation); outline-offset:1px; }

  .legend{
    display:flex; flex-wrap:wrap; gap:10px 14px;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .legend .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend .dot.m{ background:var(--menstruation); }
  .legend .dot.f{ background:var(--follicular); }
  .legend .dot.o{ background:var(--ovulation); }
  .legend .dot.l{ background:var(--luteal); }
  .legend .note{ width:100%; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .insights{ margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .insight-box{ background:var(--bg); border-radius:14px; padding:12px 14px; }
  .insight-box .label{ font-size:10.5px; color:var(--ink-soft); letter-spacing:0.3px; }
  .insight-box .value{ font-family:'Fraunces', serif; font-size:17px; margin-top:2px; display:flex; align-items:center; gap:7px; }
  .insight-box .value .swatch{ width:10px; height:10px; border-radius:50%; }
  .insight-box.full{ grid-column:1/-1; }

  .panel{
    margin-top:18px; padding-top:18px; border-top:1px solid var(--line);
    display:none; animation:slide 0.2s ease;
  }
  .panel.open{ display:block; }
  @keyframes slide{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }

  .panel .date-label{ font-family:'Fraunces', serif; font-size:17px; margin-bottom:12px; }
  .field-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; display:block; }

  .type-options{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .type-btn{
    border:1px solid var(--line); background:transparent; padding:7px 13px; border-radius:999px;
    font-size:12.5px; font-family:'Work Sans', sans-serif; cursor:pointer; color:var(--ink);
  }
  .type-btn.active[data-type="period"]{ background:var(--menstruation); border-color:var(--menstruation); color:#fff; }
  .type-btn.active[data-type="ovulation"]{ background:var(--ovulation); border-color:var(--ovulation); color:#fff; }
  .type-btn.active[data-type="none"]{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .mood-options{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .mood-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:transparent; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .mood-btn.active{ box-shadow:0 0 0 2px var(--ink); }

  textarea.note{
    width:100%; min-height:60px; border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font-family:'Work Sans', sans-serif; font-size:13px; resize:vertical; color:var(--ink);
    background:var(--bg); margin-bottom:16px;
  }
  textarea.note:focus-visible, .type-btn:focus-visible, .mood-btn:focus-visible{
    outline:2px solid var(--ovulation); outline-offset:2px;
  }

  .panel-actions{ display:flex; gap:10px; }
  .btn{ flex:1; padding:11px; border-radius:12px; border:none; font-family:'Work Sans', sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .btn.save{ background:var(--ink); color:#fff; }
  .btn.clear{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }

  footer{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:22px; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="mark">gently, month by month</div>
    <div class="sub">tap a date to log period, ovulation, mood or a note</div>
  </header>

  <div id="installBar">
    <div class="txt" id="installText">Install this as an app for one-tap access.</div>
    <button id="installBtn">Install</button>
  </div>

  <div class="card">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">
        <svg width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M8 1L2 7L8 13" stroke="#2E2933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="month-title" id="monthTitle"></div>
      <button id="nextMonth" aria-label="Next month">
        <svg width="9" height="14" viewBox="0 0 9 14" fill="none"><path d="M1 1L7 7L1 13" stroke="#2E2933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="grid" id="grid"></div>

    <div class="legend">
      <div class="item"><span class="dot m"></span>Menstruation</div>
      <div class="item"><span class="dot f"></span>Follicular</div>
      <div class="item"><span class="dot o"></span>Ovulation</div>
      <div class="item"><span class="dot l"></span>Luteal</div>
      <div class="note">Solid = logged by her · Soft = estimated from cycle history</div>
    </div>

    <div class="insights" id="insights"></div>

    <div class="panel" id="panel">
      <div class="date-label" id="panelDate"></div>

      <span class="field-label">What's today</span>
      <div class="type-options" id="typeOptions">
        <button class="type-btn" data-type="none">None</button>
        <button class="type-btn" data-type="period">Period</button>
        <button class="type-btn" data-type="ovulation">Ovulation</button>
      </div>

      <span class="field-label">Mood</span>
      <div class="mood-options" id="moodOptions"></div>

      <span class="field-label">Note</span>
      <textarea class="note" id="noteInput" placeholder="How she's feeling today…"></textarea>

      <div class="panel-actions">
        <button class="btn clear" id="clearDay">Clear day</button>
        <button class="btn save" id="saveDay">Save</button>
      </div>
    </div>
  </div>

  <footer>Stored only on this device, privately.</footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'cycleCalendarLogs';
  const MOODS = ['😊','🙂','😐','😔','😢','😡','🤕','😴'];
  const PHASE_LABEL = { menstruation:'Menstruation', follicular:'Follicular', ovulation:'Ovulation', luteal:'Luteal' };
  const PHASE_VAR = { menstruation:'--menstruation', follicular:'--follicular', ovulation:'--ovulation', luteal:'--luteal' };

  let logs = {};
  try{ logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ logs = {}; }

  let viewDate = new Date();
  viewDate.setDate(1);
  let selectedDateStr = null;
  let pendingType = 'none';
  let pendingMood = null;

  const monthTitle = document.getElementById('monthTitle');
  const grid = document.getElementById('grid');
  const panel = document.getElementById('panel');
  const panelDate = document.getElementById('panelDate');
  const typeOptions = document.getElementById('typeOptions');
  const moodOptions = document.getElementById('moodOptions');
  const noteInput = document.getElementById('noteInput');
  const insightsEl = document.getElementById('insights');

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function dayDiff(a,b){ return Math.round((a-b)/86400000); }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); }

  function periodStarts(){
    const periodDays = Object.keys(logs).filter(k => logs[k].type === 'period').sort();
    const starts = [];
    let prev = null;
    periodDays.forEach(k => {
      const d = fromKey(k);
      if(!prev || dayDiff(d, prev) > 1){ starts.push(d); }
      prev = d;
    });
    return starts;
  }

  function avgPeriodLength(){
    const periodDays = Object.keys(logs).filter(k => logs[k].type === 'period').sort();
    if(periodDays.length === 0) return 5;
    const runs = [];
    let runLen = 1;
    for(let i=1;i<periodDays.length;i++){
      if(dayDiff(fromKey(periodDays[i]), fromKey(periodDays[i-1])) === 1){ runLen++; }
      else { runs.push(runLen); runLen = 1; }
    }
    runs.push(runLen);
    return Math.round(runs.reduce((a,b)=>a+b,0)/runs.length) || 5;
  }

  function computeCycleStats(){
    const starts = periodStarts();
    if(starts.length < 2) return { avgLength:null, lastStart: starts[starts.length-1] || null, starts };
    const diffs = [];
    for(let i=1;i<starts.length;i++){ diffs.push(dayDiff(starts[i], starts[i-1])); }
    const avg = Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
    return { avgLength: avg, lastStart: starts[starts.length-1], starts };
  }

  // Determine the cycle phase for an arbitrary date, using real logged
  // intervals where available and the average cycle length to extrapolate
  // into the future or before the first logged period.
  function phaseForDate(date){
    const starts = periodStarts();
    if(starts.length === 0) return null;

    const { avgLength } = computeCycleStats();
    const effAvg = avgLength || 28;
    const periodLen = avgPeriodLength();

    let base, cycleLen;
    const last = starts[starts.length - 1];

    if(date >= last){
      base = last;
      cycleLen = effAvg;
    } else if(date < starts[0]){
      const k = Math.ceil(dayDiff(starts[0], date) / effAvg);
      base = addDays(starts[0], -k * effAvg);
      cycleLen = effAvg;
    } else {
      // find bracketing pair
      let idx = 0;
      for(let i=0;i<starts.length;i++){ if(starts[i] <= date) idx = i; }
      base = starts[idx];
      cycleLen = (idx+1 < starts.length) ? dayDiff(starts[idx+1], starts[idx]) : effAvg;
    }

    let dayInCycle = dayDiff(date, base);
    if(dayInCycle < 0){
      dayInCycle = ((dayInCycle % cycleLen) + cycleLen) % cycleLen;
    }

    const ovulationIndex = Math.max(periodLen, cycleLen - 14);

    if(dayInCycle < periodLen) return 'menstruation';
    if(dayInCycle === ovulationIndex) return 'ovulation';
    if(dayInCycle < ovulationIndex) return 'follicular';
    return 'luteal';
  }

  function renderInsights(){
    const { avgLength, lastStart } = computeCycleStats();
    const today = new Date(); today.setHours(0,0,0,0);

    let cycleDayHtml;
    if(lastStart){
      const cycleDay = dayDiff(today, lastStart) + 1;
      cycleDayHtml = `<div class="insight-box"><div class="label">cycle day</div><div class="value">${cycleDay > 0 ? cycleDay : '—'}</div></div>`;
    } else {
      cycleDayHtml = `<div class="insight-box"><div class="label">cycle day</div><div class="value">—</div></div>`;
    }

    const avgHtml = `<div class="insight-box"><div class="label">avg cycle length</div><div class="value">${avgLength ? avgLength + ' days' : 'need 2+ cycles'}</div></div>`;

    let phaseHtml = '';
    const phase = periodStarts().length ? phaseForDate(today) : null;
    if(phase){
      const color = getComputedStyle(document.documentElement).getPropertyValue(PHASE_VAR[phase]).trim();
      phaseHtml = `<div class="insight-box full"><div class="label">today's phase</div><div class="value"><span class="swatch" style="background:${color}"></span>${PHASE_LABEL[phase]}</div></div>`;
    }

    let nextHtml = '';
    if(avgLength && lastStart){
      const predicted = addDays(lastStart, avgLength);
      nextHtml = `<div class="insight-box full"><div class="label">next period expected</div><div class="value">${predicted.toLocaleDateString(undefined, { month:'short', day:'numeric' })}</div></div>`;
    }

    insightsEl.innerHTML = cycleDayHtml + avgHtml + phaseHtml + nextHtml;
  }

  function renderCalendar(){
    monthTitle.textContent = viewDate.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    grid.innerHTML = '';

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<firstWeekday;i++){
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }

    for(let day=1; day<=daysInMonth; day++){
      const d = new Date(year, month, day);
      const key = toKey(d);
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.tabIndex = 0;
      cell.dataset.key = key;

      if(sameDay(d, today)) cell.classList.add('today');
      if(key === selectedDateStr) cell.classList.add('selected');

      const log = logs[key];
      if(log && log.type === 'period'){
        cell.classList.add('confirmed-menstruation');
      } else if(log && log.type === 'ovulation'){
        cell.classList.add('confirmed-ovulation');
      } else {
        const phase = phaseForDate(d);
        if(phase) cell.classList.add('phase-' + phase);
      }

      const wrap = document.createElement('div');
      wrap.className = 'num-wrap';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = day;
      wrap.appendChild(num);

      if(log && log.mood){
        const dot = document.createElement('span');
        dot.className = 'mood-dot';
        dot.textContent = log.mood;
        wrap.appendChild(dot);
      }

      cell.appendChild(wrap);
      cell.addEventListener('click', () => openPanel(key));
      cell.addEventListener('keydown', (e) => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openPanel(key); } });
      grid.appendChild(cell);
    }

    renderInsights();
  }

  function openPanel(key){
    selectedDateStr = key;
    const log = logs[key] || {};
    pendingType = log.type || 'none';
    pendingMood = log.mood || null;

    const d = fromKey(key);
    panelDate.textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
    noteInput.value = log.note || '';

    renderTypeOptions();
    renderMoodOptions();

    panel.classList.add('open');
    renderCalendar();
    panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function renderTypeOptions(){
    typeOptions.innerHTML = '';
    ['none','period','ovulation'].forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'type-btn' + (pendingType===t ? ' active' : '');
      btn.dataset.type = t;
      btn.textContent = t === 'none' ? 'None' : t.charAt(0).toUpperCase()+t.slice(1);
      btn.addEventListener('click', () => { pendingType = t; renderTypeOptions(); });
      typeOptions.appendChild(btn);
    });
  }

  function renderMoodOptions(){
    moodOptions.innerHTML = '';
    MOODS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'mood-btn' + (pendingMood===m ? ' active' : '');
      btn.textContent = m;
      btn.addEventListener('click', () => { pendingMood = (pendingMood===m ? null : m); renderMoodOptions(); });
      moodOptions.appendChild(btn);
    });
  }

  document.getElementById('saveDay').addEventListener('click', () => {
    if(!selectedDateStr) return;
    const note = noteInput.value.trim();
    if(pendingType === 'none' && !pendingMood && !note){
      delete logs[selectedDateStr];
    } else {
      logs[selectedDateStr] = { type: pendingType, mood: pendingMood, note };
    }
    save();
    panel.classList.remove('open');
    selectedDateStr = null;
    renderCalendar();
  });

  document.getElementById('clearDay').addEventListener('click', () => {
    if(!selectedDateStr) return;
    delete logs[selectedDateStr];
    save();
    panel.classList.remove('open');
    selectedDateStr = null;
    renderCalendar();
  });

  document.getElementById('prevMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()-1); renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()+1); renderCalendar(); });

  renderCalendar();

  // ---- PWA install handling ----
  const installBar = document.getElementById('installBar');
  const installBtn = document.getElementById('installBtn');
  const installText = document.getElementById('installText');
  let deferredPrompt = null;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if(!isStandalone){
    if(isIOS){
      installText.textContent = 'To install: tap the Share icon, then "Add to Home Screen".';
      installBtn.style.display = 'none';
      installBar.classList.add('show');
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBar.classList.add('show');
      });
    }
  }

  installBtn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBar.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => { installBar.classList.remove('show'); });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
